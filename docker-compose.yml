name: control-valor-ganado

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: valor_ganado
      POSTGRES_USER: ${POSTGRES_USER:-valor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-valor_local}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d valor_ganado"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-valor}:${POSTGRES_PASSWORD:-valor_local}@db:5432/valor_ganado
      CORS_ORIGINS: '["http://localhost:8080"]'
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db-data:
